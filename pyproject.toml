[project]
name = "coadaptation-relu-networks"
version = "0.1.0"
description = "Routing-Context Augmentation Reduces Gate-Value Co-Adaptation in ReLU Networks"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "datasets>=3.0",
    "transformers>=4.30",
    "tokenizers>=0.13",
    "lm-eval>=0.4.13",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
