[project]
name = "coadaptation-relu-networks"
version = "0.1.0"
description = "Routing-Context Augmentation Reduces Gate-Value Co-Adaptation in ReLU Networks"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
